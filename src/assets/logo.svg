<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for the device frame -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </linearGradient>

    <!-- Gradient for the shopping cart & speed lines -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <!-- Gradient for light accent elements -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
  </defs>

  <!-- Tilted Phone/Tablet Screen Frame -->
  <g transform="rotate(-12 256 256)">
    <!-- Outer Outline Frame -->
    <path d="M 120,40 
             L 340,40 
             A 24,24 0 0 1 364,64 
             L 364,160 
             M 364,220 
             L 364,432 
             A 24,24 0 0 1 340,456 
             L 120,456 
             A 24,24 0 0 1 96,432 
             L 96,64 
             A 24,24 0 0 1 120,40 Z" 
          fill="none" 
          stroke="url(#frameGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Speed Lines (Motion effect inside the device screen) -->
    <rect x="200" y="220" width="40" height="14" rx="7" fill="url(#lightGrad)"/>
    <rect x="175" y="248" width="65" height="14" rx="7" fill="url(#lightGrad)"/>
    <rect x="210" y="276" width="30" height="14" rx="7" fill="url(#lightGrad)"/>

    <!-- Shopping Cart Group -->
    <g transform="translate(185, 120)">
      <!-- Cart Handle & Top Rim -->
      <path d="M 5,20 L 45,20 C 52,20 56,25 58,32 L 68,75 L 175,75 L 190,20" 
            fill="none" 
            stroke="url(#cartGrad)" 
            stroke-width="14" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Cart Grid Basket -->
      <path d="M 68,75 L 175,75 L 160,150 L 80,150 Z" 
            fill="none" 
            stroke="url(#cartGrad)" 
            stroke-width="12" 
            stroke-linejoin="round"/>

      <!-- Grid Horizontal Lines -->
      <line x1="72" y1="100" x2="171" y2="100" stroke="url(#cartGrad)" stroke-width="8"/>
      <line x1="76" y1="125" x2="166" y2="125" stroke="url(#cartGrad)" stroke-width="8"/>

      <!-- Grid Vertical Lines -->
      <line x1="102" y1="75" x2="98" y2="150" stroke="url(#cartGrad)" stroke-width="8"/>
      <line x1="128" y1="75" x2="124" y2="150" stroke="url(#cartGrad)" stroke-width="8"/>
      <line x1="154" y1="75" x2="148" y2="150" stroke="url(#cartGrad)" stroke-width="8"/>

      <!-- Cart Bottom Base Bar -->
      <path d="M 75,172 L 155,172" 
            fill="none" 
            stroke="url(#cartGrad)" 
            stroke-width="12" 
            stroke-linecap="round"/>

      <!-- Cart Wheels -->
      <circle cx="85" cy="205" r="15" fill="url(#cartGrad)"/>
      <circle cx="145" cy="205" r="15" fill="url(#cartGrad)"/>
    </g>
  </g>
</svg>
